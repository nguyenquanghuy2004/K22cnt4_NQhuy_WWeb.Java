<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Devmaster Academy</title>
  <!-- CSS Bootstrap -->
  <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
</head>
<body>
<!-- Header -->
<header class="container d-flex align-items-center mt-3 mb-4">
  <img src="https://devmaster.edu.vn/images/logo.png"
       alt="Devmaster Academy" class="me-3" style="height:70px;">
  <div>
    <h1 th:text="${@environment.getProperty('app.name')}">Devmaster Academy</h1>
    <p class="text-muted" th:text="${@environment.getProperty('app.welcome.message')}">

    </p>
  </div>
</header>

<!-- Profile Section -->
<section class="container">
  <div class="card shadow-sm mb-3" th:each="info : ${DevmasterProfile}">
    <div class="card-body">
      <h2 class="card-title" th:text="${info.name}">Tên người dùng</h2>
      <p><strong>NickName:</strong> <span th:text="${info.nickname}">nqh</span></p>
      <p><strong>Email:</strong> <span th:text="${info.email}">nguyenquanghuy285204@gmail.com</span></p>
      <p><strong>Website:</strong>
        <a th:href="${info.website}" th:text="${info.website}">https://nqhuy2004.github.io</a>
      </p>
    </div>
  </div>
  <a th:href="@{/}" class="btn btn-success">← Quay lại</a>
</section>

<!-- JS Bootstrap -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
