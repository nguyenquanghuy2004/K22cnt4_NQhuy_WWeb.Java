<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background: #CCC">
<header class="container bg-white py-2">
    <div class="logo">
        <img src="https://devmaster.edu.vn/images/logo.png" alt="Devmaster Academy"/>
    </div>
</header>

<section class="container bg-white py-3">
    <h2>DANH SÁCH SINH VIÊN</h2>
    <hr/>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.id}">1</td>
            <td th:text="${s.name}">Devmaster Academy</td>
            <td th:text="${s.email}">contact@devmaster.edu.vn</td>
            <td th:text="${s.age}">22</td>
        </tr>
        </tbody>
    </table>
</section>
</body>
</html>
